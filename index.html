<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FYSAM Shopfloor-Cockpit</title>
<style>
:root{
  --navy:#00295D; --navy-900:#001B3C; --navy-700:#385881; --navy-050:#EDF0F4;
  --silver:#AEB5BD; --silver-2:#D6DBE0;
  --paper:#EDF0F3; --card:#FFFFFF; --ink:#0E1726; --ink-2:#5A6675;
  --ok:#15794C; --ok-bg:#E4F3EC;
  --warn:#9A6100; --warn-bg:#FBF0DC;
  --nok:#A81E12; --nok-bg:#FBE7E5;
  --line:#DCE2E8;
  --r:14px;
  --tap:46px;
  --shadow:0 1px 2px rgba(10,44,94,.06), 0 6px 18px rgba(10,44,94,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-700)}

/* ---------- Marken-Mikrotypografie: abgeleitet vom Logo-Schriftzug ---------- */
.eyebrow{
  font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-2);
}
.eyebrow.on-navy{color:var(--silver)}

/* ---------- Kopf ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:var(--navy); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex; align-items:center; gap:12px;
  box-shadow:0 2px 10px rgba(6,27,59,.25);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .brandlogo{display:block;height:26px;width:auto}
.brand .wm{font-weight:800;letter-spacing:.06em;font-size:17px;line-height:1}
.brand .sub{font-size:9.5px;letter-spacing:.2em;color:var(--silver);text-transform:uppercase;margin-top:2px}
header .spacer{flex:1}
.livedot{width:8px;height:8px;border-radius:50%;background:#3ED598;box-shadow:0 0 0 0 rgba(62,213,152,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,213,152,.55)}70%{box-shadow:0 0 0 9px rgba(62,213,152,0)}100%{box-shadow:0 0 0 0 rgba(62,213,152,0)}}
.livewrap{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver)}
.mechip{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 10px 5px 5px; cursor:pointer;
}
.mechip .av{width:28px;height:28px;border-radius:50%;background:var(--silver);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:11.5px;letter-spacing:.02em}
.mechip .t{font-size:11px;line-height:1.15;text-align:left}
.mechip .t b{display:block;font-size:12.5px;font-weight:700}
.mechip .t span{color:var(--silver)}

/* ---------- Layout ---------- */
main{max-width:760px;margin:0 auto;padding:14px 12px 20px}
.sec{margin:0 0 18px}
.sec>.eyebrow{margin:0 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.pad{padding:14px}

/* ---------- Signature: der Logo-Bogen als Tageserfüllungs-Bogen ---------- */
.archcard{background:var(--navy);border:none;color:#fff;overflow:hidden;position:relative}
.archcard .pad{padding:16px 16px 6px;position:relative;z-index:1}
.archlogo{position:absolute;inset:0;opacity:.14;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center}
.archlogo img{display:block;width:92%;height:auto;max-width:420px}
.arcwrap{position:relative;padding:22px 0}
.arcnum{text-align:center}
.arcnum b{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.arcnum b span{font-size:19px;font-weight:700;margin-left:2px}
.arcnum i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);margin-top:4px}
.arcfoot{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.14)}
.arcfoot div{padding:10px 6px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.14)}
.arcfoot div:last-child{border-right:none}
.arcfoot b{display:block;font-size:19px;font-weight:800}
.arcfoot span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.kpi small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:3px}
.kpi.bad b{color:var(--nok)} .kpi.good b{color:var(--ok)} .kpi.warn b{color:var(--warn)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap); padding:0 16px; border-radius:11px; border:1px solid transparent;
  background:var(--navy); color:#fff; font-weight:650; cursor:pointer; letter-spacing:.01em;
}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--navy);border-color:transparent;padding:0 8px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{background:var(--nok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Formular ---------- */
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff
}
textarea{min-height:84px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
:focus-visible{outline:3px solid #7FA9E8;outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Chips / Filter ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Aufgaben ---------- */
.task{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:none}
.prio{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
.prio.A{background:var(--nok-bg);color:var(--nok)}
.prio.B{background:var(--warn-bg);color:var(--warn)}
.prio.C{background:var(--navy-050);color:var(--navy-700)}
.task .body{flex:1;min-width:0}
.task .t{font-weight:650;line-height:1.3}
.task.done .t{text-decoration:line-through;color:var(--ink-2)}
.meta{font-size:11.5px;color:var(--ink-2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{background:var(--navy-050);color:var(--navy-700);border-radius:6px;padding:1px 6px;font-weight:650;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.tag.late{background:var(--nok-bg);color:var(--nok)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.plain{background:#F1F4F7;color:var(--ink-2)}

/* ---------- Liste allgemein ---------- */
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-weight:650}
.row .arw{color:var(--silver);font-size:19px;line-height:1}
.ico{width:34px;height:34px;flex:none;border-radius:10px;background:var(--navy-050);color:var(--navy);display:grid;place-items:center;font-size:16px}

/* ---------- Balken ---------- */
.bar{height:8px;background:var(--navy-050);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .5s ease}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--nok)}
.blist{padding:14px}
.blist .li{margin-bottom:13px}
.blist .li:last-child{margin-bottom:0}
.blist .lh{display:flex;justify-content:space-between;font-size:13px}
.blist .lh b{font-weight:650}
.blist .lh span{color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- Checklisten-Schalter ---------- */
.ci{padding:13px 14px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:none}
.ci .q{font-weight:600;margin-bottom:9px;display:flex;gap:9px}
.ci .q i{font-style:normal;color:var(--silver);font-weight:800;font-variant-numeric:tabular-nums;min-width:20px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed=true][data-v=ok]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed=true][data-v=nok]{background:var(--nok-bg);border-color:var(--nok);color:var(--nok)}
.seg button[aria-pressed=true][data-v=na]{background:#EEF1F4;border-color:var(--silver);color:var(--ink-2)}
.ci textarea{margin-top:8px;min-height:56px}

/* ---------- Navigation unten ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  background:none;border:none;padding:9px 2px 8px;cursor:pointer;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:650;letter-spacing:.03em;
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--navy)}
nav button[aria-current=page] .nb{background:var(--navy)}
.nb{width:18px;height:2.5px;border-radius:9px;background:transparent;margin-top:1px}
.badge{position:absolute;transform:translate(13px,-6px);background:var(--nok);color:#fff;border-radius:99px;font-size:9.5px;font-weight:800;padding:1px 5px;line-height:1.5}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:44;
  width:56px;height:56px;border-radius:18px;border:none;background:var(--navy);color:#fff;
  box-shadow:0 8px 22px rgba(10,44,94,.34);font-size:26px;cursor:pointer;display:grid;place-items:center
}

/* ---------- Modal ---------- */
.mroot{position:fixed;inset:0;z-index:60;display:none}
.mroot.open{display:block}
.mbd{position:absolute;inset:0;background:rgba(6,27,59,.5)}
.msheet{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;
  background:var(--paper);border-radius:20px 20px 0 0;
  padding:0 0 calc(18px + env(safe-area-inset-bottom));
  animation:up .22s ease-out; max-width:760px;margin:0 auto;
}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msheet{animation:none}.bar>i{transition:none}.livedot{animation:none}}
.mhead{position:sticky;top:0;background:var(--paper);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.mhead h2{margin:0;font-size:17px;font-weight:750;flex:1}
.mbody{padding:14px}
.mfoot{padding:12px 14px;position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1;cursor:pointer;color:var(--ink-2)}

/* ---------- Sonstiges ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.note{font-size:12px;color:var(--ink-2);line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--navy-900);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:70;box-shadow:0 8px 24px rgba(6,27,59,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.hr{height:1px;background:var(--line);margin:14px 0}
.sig{width:118px;opacity:.95}
.report{background:#fff;padding:18px;border-radius:var(--r);border:1px solid var(--line)}
.report h3{margin:0 0 2px;font-size:16px}
.report table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.report th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line);padding:5px 4px}
.report td{padding:5px 4px;border-bottom:1px solid #EEF1F4;vertical-align:top}
@media print{
  header,nav,.fab,.mhead,.mfoot{display:none!important}
  body{background:#fff;padding:0}
  .mroot.open .msheet{position:static;max-height:none;background:#fff}
  .mbd{display:none}
  .report{border:none;padding:0}
}
@media(min-width:620px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  main{padding:18px 16px 24px}
}
</style>
</head>

<script>
/* =====================================================================
   FYSAM Shopfloor-Cockpit — Aufgabensteuerung für BL & SF
   Datenhaltung: window.storage (geteilt = alle Nutzer sehen dieselben Daten)
   ===================================================================== */

const KEY_STATE = 'fysam:cockpit:v2';
const KEY_ME    = 'fysam:me:v2';
const POLL_MS   = 7000;

const SHIFTS = { F:{n:'Frühschicht', s:6},  S:{n:'Spätschicht', s:14},  N:{n:'Nachtschicht', s:22} };
const SHIFT_ORDER = ['F','S','N'];
const AREAS = ['RTF (Rohteilfertigung)','Polieren','Eloxalanlage','Lackieren','Montage'];
/* Tatsächlich laufende Schichten je Bereich. Polieren fährt keine Nachtschicht.
   Eloxalanlage: Kontischicht mit 4 rotierenden Teams, es laufen aber wie überall
   max. 3 Schichten gleichzeitig (F/S/N) – das 4. Team hat frei/Wochenendturnus. */
const AREA_SHIFTS = {
  'RTF (Rohteilfertigung)': ['F','S','N'],
  'Polieren': ['F','S'],
  'Eloxalanlage': ['F','S','N'],
  'Lackieren': ['F','S','N'],
  'Montage': ['F','S','N']
};
function roleLabel(p){
  if(!p) return '';
  if(p.title) return p.title;
  return p.role==='WL'?'Werkleitung':p.role==='BL'?'Bereichsleiter':'Schichtführer';
}
const DAYNAMES = ['So','Mo','Di','Mi','Do','Fr','Sa'];

/* ---------- Speicher-Adapter (mit Fallback, falls kein Storage vorhanden) ---------- */
const HAS_STORE = typeof window !== 'undefined' && !!window.storage;
const MEM = {};
async function sGet(k, shared){
  if(!HAS_STORE) return MEM[k+'|'+shared] ?? null;
  try { const r = await window.storage.get(k, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function sSet(k, v, shared){
  if(!HAS_STORE){ MEM[k+'|'+shared] = v; return true; }
  try { await window.storage.set(k, v, shared); return true; }
  catch(e){ toast('Speichern fehlgeschlagen – bitte erneut versuchen'); return false; }
}

/* ---------- Helfer ---------- */
const $  = s => document.querySelector(s);
const uid = p => p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoDate = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => isoDate(new Date());
const dmy = iso => { if(!iso) return '–'; const [y,m,d]=iso.slice(0,10).split('-'); return d+'.'+m+'.'+y.slice(2); };
const hhmm = ts => { const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const initials = n => (n||'?').replace(/[^\wÄÖÜäöüß \-]/g,'').split(/[ \-]/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
function currentShift(d = new Date()){ const h=d.getHours(); if(h>=6&&h<14) return 'F'; if(h>=14&&h<22) return 'S'; return 'N'; }
function shiftDate(d = new Date()){ // Nachtschicht vor 06:00 zählt zum Vortag
  if(d.getHours()<6){ const x=new Date(d); x.setDate(x.getDate()-1); return isoDate(x); }
  return isoDate(d);
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return isoDate(d); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }

function seedPeople(){
  const p = [{ id:'p-wl', name:'Werkleitung', role:'WL', area:'', shift:'' }];

  // RTF – 3 Schichten, 3 Schichtführer
  p.push({ id:'p-bl-rtf', name:'BL RTF', role:'BL', area:'RTF (Rohteilfertigung)', shift:'' });
  ['F','S','N'].forEach(s=> p.push({ id:'p-sf-rtf-'+s, name:'SF RTF '+s, role:'SF', area:'RTF (Rohteilfertigung)', shift:s }));

  // Polieren – 2 Schichten, 2 Schichtführer
  p.push({ id:'p-bl-pol', name:'BL Polieren', role:'BL', area:'Polieren', shift:'' });
  ['F','S'].forEach(s=> p.push({ id:'p-sf-pol-'+s, name:'SF Polieren '+s, role:'SF', area:'Polieren', shift:s }));

  // Eloxalanlage – 4 Schichten/Teams (Kontischicht), 4 Schichtführer.
  // Team A/B/C fahren je eine Schicht, Team D ist im aktuellen Turnus frei/Wochenende –
  // die Zuordnung rotiert wöchentlich und wird von der Werkleitung hier nachgeführt.
  p.push({ id:'p-bl-elo', name:'BL Eloxalanlage', role:'BL', area:'Eloxalanlage', shift:'' });
  [['A','F'],['B','S'],['C','N'],['D','']].forEach(([team,s])=>
    p.push({ id:'p-sf-elo-'+team, name:'SF Eloxalanlage Team '+team, role:'SF', area:'Eloxalanlage', shift:s }));

  // Lackieren – 3 Schichten, 3 Schichtführer
  p.push({ id:'p-bl-lack', name:'BL Lackieren', role:'BL', area:'Lackieren', shift:'' });
  ['F','S','N'].forEach(s=> p.push({ id:'p-sf-lack-'+s, name:'SF Lackieren '+s, role:'SF', area:'Lackieren', shift:s }));

  // Montage – 3 Schichten, insgesamt 5 Schichtleitungen: Früh und Spät doppelt besetzt
  // (je 1 Schichtführer + 1 Teamleiter), Nachtschicht einfach besetzt (1 Teamleiter).
  // Teamleiter sind einem Schichtführer rechtlich/funktional gleichgestellt, nur andere Bezeichnung.
  p.push({ id:'p-bl-mon', name:'BL Montage', role:'BL', area:'Montage', shift:'' });
  p.push({ id:'p-sf-mon-F', name:'SF Montage F', role:'SF', area:'Montage', shift:'F' });
  p.push({ id:'p-tl-mon-F', name:'Teamleiter Montage F', role:'SF', title:'Teamleiter', area:'Montage', shift:'F' });
  p.push({ id:'p-sf-mon-S', name:'SF Montage S', role:'SF', area:'Montage', shift:'S' });
  p.push({ id:'p-tl-mon-S', name:'Teamleiter Montage S', role:'SF', title:'Teamleiter', area:'Montage', shift:'S' });
  p.push({ id:'p-tl-mon-N', name:'Teamleiter Montage N', role:'SF', title:'Teamleiter', area:'Montage', shift:'N' });

  return p;
}

let S = null, ME = null, VIEW = 'dash', SYNCING = false, MODAL = false, LASTSYNC = 0;
let F = { scope:'heute', area:'', mine:false, docCat:'', docQ:'', period:7 };

async function loadState(){
  const raw = await sGet(KEY_STATE, true);
  if(raw){ try{ S = JSON.parse(raw); }catch(e){ S = seedState(); } }
  else { S = seedState(); await sSet(KEY_STATE, JSON.stringify(S), true); }
  if(!S.genDays) S.genDays = [];
}
async function mutate(fn){
  const raw = await sGet(KEY_STATE, true);
  let fresh = S;
  if(raw){ try{ fresh = JSON.parse(raw); }catch(e){} }
  fn(fresh);
  fresh.updated = Date.now();
  S = fresh;
  await sSet(KEY_STATE, JSON.stringify(fresh), true);
  LASTSYNC = Date.now();
  render();
}
function logEvent(st, text, kind){
  st.log.unshift({ id:uid('l'), ts:Date.now(), by: ME?ME.name:'System', text, kind:kind||'info' });
  if(st.log.length > 200) st.log.length = 200;
}

/* ---------- Tagesaufgaben aus Routinen erzeugen ---------- */
function generateRoutineTasks(st, dateISO){
  const d = new Date(dateISO+'T12:00:00');
  const wd = d.getDay();
  let made = 0;
  st.routines.filter(r=>r.active && r.days.includes(wd)).forEach(r=>{
    st.areas.forEach(area=>{
      const activeShifts = AREA_SHIFTS[area] || SHIFT_ORDER;
      r.shifts.filter(sh=>activeShifts.includes(sh)).forEach(sh=>{
        const key = r.id+'|'+area+'|'+sh+'|'+dateISO;
        if(st.tasks.some(t=>t.key===key)) return;
        const person = st.people.find(p => p.role===r.role && p.area===area && (r.role==='BL' || p.shift===sh));
        const start = new Date(dateISO+'T00:00:00');
        start.setHours(SHIFTS[sh].s, 0, 0, 0);
        if(sh==='N') { /* Nacht läuft in den Folgetag */ }
        const due = new Date(start.getTime() + r.offset*60000);
        st.tasks.push({
          id: uid('t'), key,
          title: r.title, desc: '', area, shift: sh,
          assignee: person ? person.id : '', role: r.role,
          prio: r.prio, due: due.toISOString(), date: dateISO,
          status: 'offen', created: start.getTime(), createdBy: 'Routine',
          source: 'routine', routineId: r.id, tpl: r.tpl || null,
          notes: []
        });
        made++;
      });
    });
  });
  return made;
}
async function ensureToday(){
  const d = shiftDate();
  if(S.genDays.includes(d)) return;
  await mutate(st=>{
    if(st.genDays.includes(d)) return;
    const n = generateRoutineTasks(st, d);
    st.genDays.push(d);
    if(st.genDays.length>30) st.genDays = st.genDays.slice(-30);
    if(n) logEvent(st, n+' Tagesaufgaben für '+dmy(d)+' erteilt', 'sys');
  });
}

/* ---------- Abfragen ---------- */
const personById = id => (S.people.find(p=>p.id===id) || null);
const personName = id => { const p=personById(id); return p?p.name:'nicht zugewiesen'; };
const isOverdue = t => t.status!=='erledigt' && t.status!=='geprüft' && new Date(t.due).getTime() < Date.now();
const isOpen = t => t.status==='offen' || t.status==='laufend';

function visibleTasks(){
  if(!ME) return [];
  if(ME.role==='WL') return S.tasks;
  if(ME.role==='BL') return S.tasks.filter(t=>t.area===ME.area);
  // SF/Teamleiter: nur die eigenen zugewiesenen Aufgaben, keine Aufgaben anderer
  // Schichtführer/Teamleiter im selben Bereich oder derselben Schicht.
  return S.tasks.filter(t=>t.assignee===ME.id);
}
function myTasks(){ return ME ? S.tasks.filter(t=>t.assignee===ME.id) : []; }

function dayStats(dateISO){
  const t = S.tasks.filter(x=>x.date===dateISO);
  const done = t.filter(x=>x.status==='erledigt'||x.status==='geprüft').length;
  const late = t.filter(isOverdue).length;
  const open = t.filter(isOpen).length;
  const nok  = S.runs.filter(r=>r.date===dateISO).reduce((a,r)=>a+r.nok,0);
  return { total:t.length, done, late, open, nok, quote: pct(done, t.length) };
}

/* =====================  Navigation  ===================== */
const NAVS = [
  { v:'dash',  t:'Cockpit',    d:'M3 11 12 3l9 8M5 10v10h14V10' },
  { v:'tasks', t:'Aufgaben',   d:'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2' },
  { v:'checks',t:'Checklisten',d:'M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 9h6M9 13h6M9 17h3' },
  { v:'docs',  t:'Dokumente',  d:'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5' },
  { v:'stats', t:'Auswertung', d:'M4 20V10M10 20V4M16 20v-7M22 20H2' }
];
function renderNav(){
  const late = ME ? visibleTasks().filter(isOverdue).length : 0;
  $('#nav').innerHTML = NAVS.map(n=>`
    <button data-act="nav" data-v="${n.v}" ${VIEW===n.v?'aria-current="page"':''}>
      <span style="position:relative">
        <svg viewBox="0 0 24 24"><path d="${n.d}"/></svg>
        ${n.v==='tasks'&&late?`<span class="badge">${late>99?'99+':late}</span>`:''}
      </span>
      <span>${n.t}</span><span class="nb"></span>
    </button>`).join('');
}

/* =====================  Modal  ===================== */
function openModal(title, body, foot){
  MODAL = true;
  $('#msheet').innerHTML = `
    <div class="mhead"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Schließen">✕</button></div>
    <div class="mbody">${body}</div>
    ${foot?`<div class="mfoot">${foot}</div>`:''}`;
  $('#mroot').classList.add('open');
  $('#msheet').scrollTop = 0;
}
function closeModal(){ MODAL=false; $('#mroot').classList.remove('open'); $('#msheet').innerHTML=''; }

/* =====================  Ansichten  ===================== */
function render(){
  if(!ME){ renderIdentity(); return; }
  $('#meav').textContent = initials(ME.name);
  $('#menm').textContent = ME.name;
  $('#mero').textContent = ME.role==='WL' ? 'Werkleitung' : (roleLabel(ME)+' · '+(ME.area||'')+(ME.shift?' · '+SHIFTS[ME.shift].n:''));
  $('#livet').textContent = LASTSYNC ? hhmm(LASTSYNC) : 'live';
  const map = { dash:viewDash, tasks:viewTasks, checks:viewChecks, docs:viewDocs, stats:viewStats, setup:viewSetup };
  $('#app').innerHTML = (map[VIEW]||viewDash)();
  renderNav();
  $('#fab').style.display = (VIEW==='dash'||VIEW==='tasks') ? 'grid' : 'none';
}

/* ---------- Anmeldung / Rollenwahl ---------- */
function renderIdentity(){
  $('#fab').style.display='none';
  $('#meav').textContent='–'; $('#menm').textContent='Anmelden'; $('#mero').textContent='Rolle wählen';
  const byRole = { WL:[], BL:[], SF:[] };
  S.people.forEach(p=>byRole[p.role]&&byRole[p.role].push(p));
  $('#app').innerHTML = `
    <div class="sec">
      <div class="card pad">
        <div class="eyebrow">Anmeldung</div>
        <h1 style="margin:6px 0 4px;font-size:21px;font-weight:750">Wer arbeitet gerade?</h1>

/* ---------- Aufgabenzeile ---------- */
function taskRow(t){
  const late = isOverdue(t), done = t.status==='erledigt'||t.status==='geprüft';
  return `<div class="task ${done?'done':''}" data-act="task" data-id="${t.id}" style="cursor:pointer">
    <span class="prio ${t.prio}">${done?'✓':t.prio}</span>
    <span class="body">
      <span class="t">${esc(t.title)}</span>
      <span class="meta">
        <span class="tag plain">${esc(t.area)}</span>
        ${t.shift?`<span class="tag plain">${t.shift}</span>`:''}
        <span>${personName(t.assignee)}</span>
        <span class="tag ${late?'late':done?'ok':'warn'}">${done?t.status:late?'überfällig seit '+hhmm(t.due):'bis '+hhmm(t.due)}</span>
        ${t.status==='laufend'?'<span class="tag warn">in Arbeit</span>':''}
      </span>
    </span></div>`;
}

/* ---------- Aufgaben ---------- */
function viewTasks(){
  let list = visibleTasks();
  const d = shiftDate();
  if(F.scope==='heute')      list = list.filter(t=>t.date===d);
  else if(F.scope==='offen') list = list.filter(isOpen);
  else if(F.scope==='spaet') list = list.filter(isOverdue);
  else if(F.scope==='fertig')list = list.filter(t=>t.status==='erledigt'||t.status==='geprüft');
  if(F.area) list = list.filter(t=>t.area===F.area);
  if(F.mine) list = list.filter(t=>t.assignee===ME.id);
  list = [...list].sort((a,b)=> (isOpen(b)-isOpen(a)) || (new Date(a.due)-new Date(b.due)));

  const scopes = [['heute','Heute'],['offen','Offen'],['spaet','Überfällig'],['fertig','Erledigt'],['alle','Alle']];
  return `
  <div class="sec">
    <div class="chips">
      ${scopes.map(([v,t])=>`<button class="chip" data-act="scope" data-v="${v}" aria-pressed="${F.scope===v}">${t}</button>`).join('')}
      <button class="chip" data-act="mine" aria-pressed="${F.mine}">Nur meine</button>
    </div>
    ${ME.role!=='SF'?`
    <label class="f" style="margin-top:0"><span>Bereich</span>
      <select data-act="areafilter"><option value="">Alle Bereiche</option>
      ${S.areas.map(a=>`<option ${F.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`:''}
  </div>
  <div class="sec">
    <div class="eyebrow">${list.length} Aufgaben</div>
    <div class="card">${ list.length ? list.map(taskRow).join('') :
      `<div class="empty"><b>Keine Aufgaben in dieser Auswahl</b>Filter ändern oder mit „+“ eine Aufgabe erteilen.</div>` }</div>
  </div>`;
}

/* ---------- Aufgaben-Detail ---------- */

  const late = isOverdue(t);
  const canDo   = ME.role==='WL' || t.assignee===ME.id || (ME.role==='BL'&&t.area===ME.area);
  const canFree = ME.role==='WL' || (ME.role==='BL' && t.area===ME.area);
  const body = `
    <div class="card pad">
      <div class="eyebrow">${esc(t.area)} · ${t.shift?SHIFTS[t.shift].n:'schichtübergreifend'} · Priorität ${t.prio}</div>
      <h3 style="margin:6px 0 8px;font-size:17px;font-weight:700">${esc(t.title)}</h3>
      ${t.desc?`<p style="margin:0 0 8px">${esc(t.desc)}</p>`:''}
      <div class="meta">
        <span class="tag ${late?'late':'plain'}">Fällig ${dmy(t.date)} ${hhmm(t.due)}</span>
        <span class="tag ${t.status==='erledigt'||t.status==='geprüft'?'ok':t.status==='laufend'?'warn':'plain'}">${t.status}</span>
        <span class="tag plain">${t.source==='routine'?'Tagesroutine':t.source==='checkliste'?'aus Checkliste':'Einzelauftrag'}</span>
      </div>
      <div class="hr"></div>
      <div class="note">Zugewiesen an <b>${esc(personName(t.assignee))}</b> · erteilt von ${esc(t.createdBy)}
      ${t.doneAt?`<br>Erledigt ${dmy(isoDate(new Date(t.doneAt)))} ${hhmm(t.doneAt)} durch ${esc(t.doneBy||'')}`:''}
      ${t.checkedBy?`<br>Freigegeben durch ${esc(t.checkedBy)}`:''}</div>
      ${t.tpl?`<div class="btnrow" style="margin-top:12px"><button class="btn sec sm block" data-act="runtpl" data-id="${t.tpl}" data-task="${t.id}">Zugehörige Checkliste öffnen</button></div>`:''}
    </div>
    ${t.notes&&t.notes.length?`
    <div class="sec" style="margin-top:12px">
      <div class="eyebrow">Rückmeldungen</div>
      <div class="card">${t.notes.map(n=>`<div class="task"><span class="body"><span class="t" style="font-weight:550;font-size:14px">${esc(n.text)}</span><span class="meta">${esc(n.by)} · ${dmy(isoDate(new Date(n.ts)))} ${hhmm(n.ts)}</span></span></div>`).join('')}</div>
    </div>`:''}
    ${canDo?`<label class="f"><span>Rückmeldung ergänzen</span><textarea id="tnote" placeholder="Was wurde gemacht? Welche Abweichung?"></textarea></label>`:''}`;

  const foot = `<div class="btnrow">
    ${canDo && t.status==='offen'   ? `<button class="btn sec" data-act="tstatus" data-id="${t.id}" data-v="laufend">In Arbeit</button>`:''}
    ${canDo && isOpen(t)            ? `<button class="btn" data-act="tstatus" data-id="${t.id}" data-v="erledigt">Erledigt melden</button>`:''}
    ${canFree && t.status==='erledigt'?`<button class="btn" data-act="tstatus" data-id="${t.id}" data-v="geprüft">Freigeben</button>
                                        <button class="btn sec" data-act="tstatus" data-id="${t.id}" data-v="offen">Zurückweisen</button>`:''}
    ${canDo && t.notes!==undefined  ? `<button class="btn sec" data-act="tnote" data-id="${t.id}">Nur Rückmeldung speichern</button>`:''}
    ${(ME.role==='WL'||ME.role==='BL')?`<button class="btn ghost" data-act="tdel" data-id="${t.id}">Löschen</button>`:''}
  </div>`;
  openModal('Aufgabe', body, foot);
}

async function saveNewTask(){
  const title = $('#ntitle').value.trim();
  if(!title){ toast('Bitte einen Aufgabentext eingeben'); $('#ntitle').focus(); return; }
  const date = $('#ndate').value || today();
  const due = new Date(date+'T'+($('#ntime').value||'12:00')+':00');
  const ass = $('#nass').value;
  const t = {
    id: uid('t'), key:'', title, desc: $('#ndesc').value.trim(),
    area: $('#narea').value, shift: $('#nshift').value,
    assignee: ass, role: ass? (personById(ass)||{}).role : '',
    prio: $('#nprio').value, due: due.toISOString(), date,
    status:'offen', created: Date.now(), createdBy: ME.name,
    source:'manuell', routineId:null, tpl:null, notes:[]
  };
  await mutate(st=>{ st.tasks.push(t); logEvent(st, 'Aufgabe erteilt: '+title+' ('+t.area+')', 'info'); });
  closeModal(); toast('Aufgabe erteilt');
}

/* ---------- Checklisten ---------- */

  const runs = S.runs.filter(r=> ME.role==='WL' ? true : r.area===ME.area).slice(0,25);
  const cadence = { schicht:'je Schicht', taeglich:'täglich', woche:'wöchentlich', ereignis:'je Auftrag / Rüstwechsel' };
  return `
  <div class="sec">
    <div class="eyebrow">Checkliste starten</div>
    <div class="card">
      ${tpls.map(t=>{
        const doneToday = S.runs.some(r=>r.tplId===t.id && r.date===d && r.area===(ME.area||r.area) && (t.cadence!=='schicht'||r.shift===currentShift()));
        return `<div class="row" data-act="runtpl" data-id="${t.id}">
          <span class="ico" style="${doneToday?'background:var(--ok-bg);color:var(--ok)':''}">${doneToday?'✓':t.items.length}</span>
          <span class="body"><b>${esc(t.name)}</b>
            <span class="meta">${t.role} · ${cadence[t.cadence]} · ${t.items.length} Prüfpunkte
            ${doneToday?'<span class="tag ok">für diese Schicht erfasst</span>':''}</span></span>

      }).join('')}
    </div>
  </div>
  <div class="sec">
    <div class="eyebrow">Zuletzt abgeschlossen</div>
    <div class="card">${ runs.length ? runs.map(r=>`
      <div class="row" data-act="run" data-id="${r.id}">
        <span class="ico" style="${r.nok?'background:var(--nok-bg);color:var(--nok)':'background:var(--ok-bg);color:var(--ok)'}">${r.nok||'✓'}</span>
        <span class="body"><b>${esc(r.name)}</b><span class="meta">${dmy(r.date)} · ${esc(r.area)} · ${SHIFTS[r.shift]?SHIFTS[r.shift].n:''} · ${esc(r.by)}</span></span>
        <span class="arw">›</span></div>`).join('') : `<div class="empty"><b>Noch keine Durchläufe</b>Oben eine Checkliste auswählen.</div>` }</div>

let RUN = null;
function openRun(tplId, taskId){
  const t = S.templates.find(x=>x.id===tplId); if(!t) return;
  RUN = { tplId:t.id, taskId: taskId||null, area: ME.area || S.areas[0], shift: ME.shift || currentShift(),
          items: t.items.map(x=>({ text:x, val:'', note:'' })) };
  drawRun();
}
function drawRun(){
  const keep = MODAL ? ($('#msheet').scrollTop||0) : 0;
  const t = S.templates.find(x=>x.id===RUN.tplId);
  const body = `
    ${ME.role!=='SF'?`<div class="grid2">
      <label class="f" style="margin-top:0"><span>Bereich</span><select data-act="runarea">${S.areas.map(a=>`<option ${RUN.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label>
      <label class="f" style="margin-top:0"><span>Schicht</span><select data-act="runshift">${SHIFT_ORDER.map(s=>`<option value="${s}" ${RUN.shift===s?'selected':''}>${SHIFTS[s].n}</option>`).join('')}</select></label>
    </div><div style="height:12px"></div>`:''}
    <div class="card">${RUN.items.map((it,i)=>`
      <div class="ci">
        <div class="q"><i>${pad(i+1)}</i><span>${esc(it.text)}</span></div>
        <div class="seg">
          <button data-act="ci" data-i="${i}" data-v="ok"  aria-pressed="${it.val==='ok'}">i.O.</button>
          <button data-act="ci" data-i="${i}" data-v="nok" aria-pressed="${it.val==='nok'}">NOK</button>
          <button data-act="ci" data-i="${i}" data-v="na"  aria-pressed="${it.val==='na'}">entfällt</button>
        </div>
        ${it.val==='nok'?`<textarea data-act="cinote" data-i="${i}" placeholder="Pflicht bei NOK: Was wurde festgestellt? Wo genau?">${esc(it.note)}</textarea>`:''}
      </div>`).join('')}</div>
    <p class="note" style="margin-top:10px">Jeder NOK-Befund erzeugt automatisch eine Aufgabe mit Priorität ${t.nokPrio} und Frist ${t.nokH} Stunden an den zuständigen Bereichsleiter.</p>`;
  const open = RUN.items.filter(i=>!i.val).length;
  window._runFoot = true;
  openModal(t.name, body,
    `<button class="btn block" data-act="saverun" ${open?'disabled':''}>${open?open+' Prüfpunkte offen':'Checkliste abschließen'}</button>`);
  if(keep) $('#msheet').scrollTop = keep;
}
async function saveRun(){
  const t = S.templates.find(x=>x.id===RUN.tplId);
  const missing = RUN.items.some(i=>i.val==='nok' && !i.note.trim());
  if(missing){ toast('Bei NOK ist eine Bemerkung erforderlich'); return; }
  const d = shiftDate(), nok = RUN.items.filter(i=>i.val==='nok');
  const run = { id:uid('r'), tplId:t.id, name:t.name, area:RUN.area, shift:RUN.shift, date:d,
                by:ME.name, byId:ME.id, finished:Date.now(), nok:nok.length,
                items:RUN.items.map(i=>({text:i.text,val:i.val,note:i.note})) };
  const taskId = RUN.taskId;
  await mutate(st=>{
    st.runs.unshift(run);
    if(st.runs.length>500) st.runs.length=500;
    const bl = st.people.find(p=>p.role==='BL'&&p.area===run.area);
    nok.forEach(i=>{
      const due = new Date(Date.now()+t.nokH*3600000);
      st.tasks.push({ id:uid('t'), key:'', title:'Abstellmaßnahme: '+i.text, desc:i.note,
        area:run.area, shift:run.shift, assignee: bl?bl.id:'', role:'BL', prio:t.nokPrio,
        due:due.toISOString(), date:isoDate(due), status:'offen', created:Date.now(),
        createdBy:ME.name, source:'checkliste', routineId:null, tpl:null,
        notes:[{by:ME.name, ts:Date.now(), text:'Aus '+t.name+' ('+run.area+', '+SHIFTS[run.shift].n+')'}] });
    });
    // zugehörige Routineaufgabe automatisch erledigen
    const link = taskId ? st.tasks.find(x=>x.id===taskId)
      : st.tasks.find(x=>x.tpl===t.id && x.area===run.area && x.date===d && isOpen(x) && (x.shift===run.shift||!x.shift));
    if(link && isOpen(link)){ link.status='erledigt'; link.doneAt=Date.now(); link.doneBy=ME.name;
      (link.notes=link.notes||[]).push({by:ME.name,ts:Date.now(),text:'Checkliste abgeschlossen · '+nok.length+' NOK'}); }
    logEvent(st, t.name+' abgeschlossen ('+run.area+', '+SHIFTS[run.shift].n+') – '+(nok.length?nok.length+' NOK':'ohne Befund'), nok.length?'nok':'done');
  });
  RUN=null; closeModal();
  toast(nok.length ? nok.length+' Maßnahme(n) erzeugt' : 'Checkliste abgeschlossen – ohne Befund');
}
function openRunDetail(id){

      ${r.nok?`<span class="tag late">${r.nok} × NOK</span>`:`<span class="tag ok">ohne Befund</span>`}</p>
    </div>

/* Prüfpunkt ohne Neuaufbau der Liste umschalten (kein Springen, kein Flackern) */
function setCi(btn){
  const i = +btn.dataset.i, v = btn.dataset.v, box = btn.closest('.ci');
  RUN.items[i].val = v;
  box.querySelectorAll('[data-act=ci]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
  let ta = box.querySelector('[data-act=cinote]');
  if(v==='nok'){
    if(!ta){ ta = document.createElement('textarea'); ta.setAttribute('data-act','cinote'); ta.dataset.i=i;
      ta.placeholder='Pflicht bei NOK: Was wurde festgestellt? Wo genau?'; box.appendChild(ta); ta.focus(); }
    ta.value = RUN.items[i].note;
  } else if(ta){ ta.remove(); RUN.items[i].note=''; }
  const open = RUN.items.filter(x=>!x.val).length;
  const b = document.querySelector('[data-act=saverun]');
  if(b){ b.disabled = open>0; b.textContent = open ? open+' Prüfpunkte offen' : 'Checkliste abschließen'; }
}

/* ---------- Auswertung ---------- */
function periodRuns(){ const from = daysAgo(F.period); return S.runs.filter(r=>r.date>=from); }
function periodTasks(){ const from = daysAgo(F.period); return S.tasks.filter(t=>t.date>=from && t.date<=today()); }
function plannedRuns(){
  // Sollzahl Checklisten im Zeitraum: je Schicht = 3/Tag, täglich = 1/Werktag, wöchentlich = 1/Woche
  const areas = S.areas.length, d = F.period;
  let n = 0;
  S.templates.forEach(t=>{
    if(t.cadence==='schicht')  n += areas * 3 * d;
    if(t.cadence==='taeglich') n += areas * Math.round(d*5/7);
    if(t.cadence==='woche')    n += areas * Math.max(1, Math.round(d/7));
  });
  return n;
}
function viewStats(){
  const T = periodTasks(), R = periodRuns();
  const done = T.filter(t=>t.status==='erledigt'||t.status==='geprüft');
  const late = T.filter(t=>isOverdue(t) || (t.doneAt && t.doneAt > new Date(t.due).getTime()));
  const react = done.filter(t=>t.doneAt).map(t=>(t.doneAt - t.created)/3600000);
  const avg = react.length ? (react.reduce((a,b)=>a+b,0)/react.length) : 0;
  const soll = plannedRuns(), comp = pct(R.length, soll);
  const nokItems = {};
  R.forEach(r=>r.items.filter(i=>i.val==='nok').forEach(i=>{ nokItems[i.text]=(nokItems[i.text]||0)+1; }));
  const topNok = Object.entries(nokItems).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const byArea = S.areas.map(a=>{
    const t = T.filter(x=>x.area===a), dn = t.filter(x=>x.status==='erledigt'||x.status==='geprüft').length;
    return { a, total:t.length, done:dn, q:pct(dn,t.length), late:t.filter(isOverdue).length,
             runs:R.filter(r=>r.area===a).length, nok:R.filter(r=>r.area===a).reduce((s,r)=>s+r.nok,0) };
  }).sort((x,y)=>x.q-y.q);
  const byShift = SHIFT_ORDER.map(s=>{
    const t = T.filter(x=>x.shift===s), dn = t.filter(x=>x.status==='erledigt'||x.status==='geprüft').length;
    return { s, total:t.length, q:pct(dn,t.length) };
  });
  const cls = q => q>=95?'ok':q>=80?'warn':'bad';

  return `
  <div class="sec">
    <div class="chips">
      ${[7,30,90].map(p=>`<button class="chip" data-act="period" data-v="${p}" aria-pressed="${F.period===p}">${p} Tage</button>`).join('')}
    </div>
  </div>
  <div class="sec">
    <div class="eyebrow">Kennzahlen · letzte ${F.period} Tage</div>
    <div class="kpis">
      <div class="kpi ${cls(pct(done.length,T.length))==='ok'?'good':cls(pct(done.length,T.length))==='bad'?'bad':'warn'}">
        <span>Erfüllungsgrad</span><b>${pct(done.length,T.length)}%</b><small>${done.length} von ${T.length} Aufgaben</small></div>
      <div class="kpi ${late.length?'bad':'good'}"><span>Terminverzug</span><b>${pct(late.length,T.length)}%</b><small>${late.length} Aufgaben verspätet</small></div>
      <div class="kpi"><span>Ø Durchlaufzeit</span><b>${avg.toFixed(1)}<span style="font-size:15px"> h</span></b><small>Erteilung bis Vollzug</small></div>
      <div class="kpi ${comp>=90?'good':comp>=70?'warn':'bad'}"><span>Checklisten-Quote</span><b>${comp}%</b><small>${R.length} von ${soll} Soll-Durchläufen</small></div>
    </div>
  </div>
  <div class="sec">
    <div class="eyebrow">Erfüllungsgrad je Bereich</div>
    <div class="card blist">
      ${byArea.map(b=>`<div class="li">
        <div class="lh"><b>${esc(b.a)}</b><span>${b.q}% · ${b.done}/${b.total}${b.late?' · '+b.late+' offen überfällig':''}</span></div>
        <div class="bar"><i class="${cls(b.q)}" style="width:${b.q}%"></i></div>
      </div>`).join('')}
    </div>
  </div>
  <div class="sec">
    <div class="eyebrow">Erfüllungsgrad je Schicht</div>
    <div class="card blist">
      ${byShift.map(b=>`<div class="li">
        <div class="lh"><b>${SHIFTS[b.s].n}</b><span>${b.q}% · ${b.total} Aufgaben</span></div>
        <div class="bar"><i class="${cls(b.q)}" style="width:${b.q}%"></i></div>
      </div>`).join('')}
    </div>
  </div>
  <div class="sec">
    <div class="eyebrow">Häufigste NOK-Befunde</div>
    <div class="card">${ topNok.length ? topNok.map(([txt,n])=>`
      <div class="task"><span class="prio A">${n}</span><span class="body"><span class="t" style="font-weight:550;font-size:14px">${esc(txt)}</span>
      <span class="meta">${n} Befunde in ${F.period} Tagen – Kandidat für Ursachenanalyse</span></span></div>`).join('')
      : `<div class="empty">Keine NOK-Befunde im Zeitraum.</div>` }</div>
  </div>
  <div class="sec">
    <div class="btnrow">
      <button class="btn sec" data-act="csv" data-v="tasks">Aufgaben als CSV</button>
      <button class="btn sec" data-act="csv" data-v="runs">Checklisten als CSV</button>
      ${ME.role==='WL'?`<button class="btn" data-act="report">Tagesbericht</button>
                        <button class="btn sec" data-act="nav" data-v="setup">Einrichtung</button>`:''}
    </div>
  </div>`;
}

/* ---------- CSV ---------- */
function csvEsc(v){ v = String(v??''); return /[";\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildCsv(kind){
  if(kind==='tasks'){
    const h = ['Datum','Bereich','Schicht','Aufgabe','Prioritaet','Zustaendig','Faellig','Status','Erledigt am','Erledigt durch','Quelle'];
    const rows = periodTasks().map(t=>[t.date,t.area,t.shift,t.title,t.prio,personName(t.assignee),
      dmy(t.date)+' '+hhmm(t.due),t.status,t.doneAt?dmy(isoDate(new Date(t.doneAt)))+' '+hhmm(t.doneAt):'',t.doneBy||'',t.source]);
    return [h,...rows].map(r=>r.map(csvEsc).join(';')).join('\r\n');
  }
  const h = ['Datum','Checkliste','Bereich','Schicht','Erfasser','Pruefpunkte','NOK','NOK-Befunde'];
  const rows = periodRuns().map(r=>[r.date,r.name,r.area,r.shift,r.by,r.items.length,r.nok,
    r.items.filter(i=>i.val==='nok').map(i=>i.text+' – '+i.note).join(' | ')]);
  return [h,...rows].map(r=>r.map(csvEsc).join(';')).join('\r\n');
}
function exportCsv(kind){
  const csv = buildCsv(kind);
  const name = 'FYSAM_'+(kind==='tasks'?'Aufgaben':'Checklisten')+'_'+today()+'.csv';
  openModal('CSV-Export', `
    <p class="note">${csv.split('\r\n').length-1} Datensätze der letzten ${F.period} Tage. Semikolon-getrennt, direkt in Excel einlesbar.</p>
    <label class="f"><span>Daten</span><textarea id="csvout" style="min-height:190px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px">${esc(csv)}</textarea></label>`,
    `<div class="btnrow"><button class="btn" data-act="csvdl" data-n="${esc(name)}">Datei herunterladen</button>
      <button class="btn sec" data-act="csvcopy">In Zwischenablage kopieren</button></div>`);
}

/* ---------- Beispieldaten für die Vorstellung im Werk ---------- */
async function makeDemo(){
  await mutate(st=>{
    for(let k=1;k<=13;k++){
      const d = daysAgo(k);
      generateRoutineTasks(st, d);
      if(!st.genDays.includes(d)) st.genDays.push(d);
      st.tasks.filter(t=>t.date===d).forEach(t=>{
        const r = Math.random();
        if(r<0.86){ t.status = r<0.55?'geprüft':'erledigt';
          t.doneAt = new Date(t.due).getTime() - (Math.random()*3-0.6)*3600000;
          t.doneBy = personName(t.assignee); }
      });
      st.areas.forEach(a=>{
        (AREA_SHIFTS[a]||SHIFT_ORDER).forEach(sh=>{
          st.templates.filter(t=>t.cadence==='schicht').forEach(tpl=>{
            if(Math.random()<0.82){
              const items = tpl.items.map(x=>{ const n = Math.random()<0.045;
                return { text:x, val: n?'nok':'ok', note: n?'Befund im Schichtverlauf dokumentiert':'' }; });
              const nok = items.filter(i=>i.val==='nok').length;
              st.runs.push({ id:uid('r'), tplId:tpl.id, name:tpl.name, area:a, shift:sh, date:d,
                by:'SF '+a+' '+sh, byId:'', finished:new Date(d+'T'+pad(SHIFTS[sh].s)+':40:00').getTime(),
                nok, items });
            }
          });
        });
      });
    }
    st.runs.sort((a,b)=>b.finished-a.finished);
    logEvent(st, 'Beispieldaten der letzten 13 Tage erzeugt', 'sys');
  });
  toast('Beispieldaten erzeugt – Auswertung ist jetzt gefüllt');
  VIEW='stats'; render();
}

/* ---------- Ereignisse ---------- */
const ACT = {
  nav: e => { VIEW = e.dataset.v; window.scrollTo(0,0); render(); },
  setme: async e => { ME = personById(e.dataset.id); await sSet(KEY_ME, ME.id, false); await ensureToday(); render(); },
  me: () => { if(!ME) return; ME = null; sSet(KEY_ME,'',false); VIEW='dash'; render(); },
  scope: e => { F.scope = e.dataset.v; render(); },
  mine: () => { F.mine = !F.mine; render(); },
  period: e => { F.period = +e.dataset.v; render(); },
  doccat: e => { F.docCat = e.dataset.v; render(); },
  task: e => openTask(e.dataset.id),
  newtask: () => openNewTask(),
  savetask: () => saveNewTask(),
  tstatus: async e => {
    const id = e.dataset.id, v = e.dataset.v;
    const nEl = document.getElementById('tnote'); const note = nEl ? nEl.value.trim() : '';
    await mutate(st=>{
      const t = st.tasks.find(x=>x.id===id); if(!t) return;
      t.status = v;
      if(note) (t.notes=t.notes||[]).push({by:ME.name, ts:Date.now(), text:note});
      if(v==='erledigt'){ t.doneAt=Date.now(); t.doneBy=ME.name; logEvent(st,'Erledigt: '+t.title+' ('+t.area+')','done'); }
      if(v==='geprüft'){ t.checkedBy=ME.name; logEvent(st,'Freigegeben: '+t.title,'done'); }
      if(v==='offen'){ t.doneAt=null; logEvent(st,'Zurückgewiesen: '+t.title+' ('+t.area+')','nok'); }
      if(v==='laufend') logEvent(st,'In Arbeit: '+t.title+' ('+t.area+')','info');
    });
    closeModal(); toast(v==='geprüft'?'Freigegeben':v==='offen'?'Zurückgewiesen':'Status: '+v);
  },
  tnote: async e => {
    const note = ($('#tnote')||{value:''}).value.trim(); if(!note){ toast('Bitte Text eingeben'); return; }
    await mutate(st=>{ const t=st.tasks.find(x=>x.id===e.dataset.id); if(t){ (t.notes=t.notes||[]).push({by:ME.name,ts:Date.now(),text:note}); logEvent(st,'Rückmeldung zu: '+t.title,'info'); } });
    closeModal(); toast('Rückmeldung gespeichert');
  },
  tdel: async e => {
    if(!confirm('Aufgabe wirklich löschen?')) return;
    await mutate(st=>{ const i=st.tasks.findIndex(x=>x.id===e.dataset.id); if(i>-1){ logEvent(st,'Gelöscht: '+st.tasks[i].title,'nok'); st.tasks.splice(i,1);} });
    closeModal();
  },
  runtpl: e => openRun(e.dataset.id, e.dataset.task||null),
  run: e => openRunDetail(e.dataset.id),
  ci: e => setCi(e),
  saverun: () => saveRun(),
  doc: e => openDoc(e.dataset.id),
  docopen: e => { const d=S.docs.find(x=>x.id===e.dataset.id); if(d&&d.url) window.open(d.url,'_blank','noopener'); },
  docnew: () => {
    openModal('Dokument hinterlegen', `
      <label class="f" style="margin-top:0"><span>Bezeichnung</span><input type="text" id="dname" placeholder="z. B. Prüfplan Zierleiste XY"></label>
      <label class="f"><span>Kategorie</span><input type="text" id="dcat" value="Produktion"></label>
      <label class="f"><span>Link</span><input type="url" id="durl" placeholder="https://…"></label>
      <label class="f"><span>Hinweis</span><input type="text" id="dnote"></label>`,
      `<button class="btn block" data-act="docsave" data-id="">Speichern</button>`);
  },
  docsave: async e => {
    const id = e.dataset.id, n = $('#dname').value.trim();
    if(!n){ toast('Bitte Bezeichnung eingeben'); return; }
    await mutate(st=>{
      const o = { name:n, cat:$('#dcat').value.trim()||'Sonstiges', url:$('#durl').value.trim(), note:$('#dnote').value.trim() };
      if(id){ Object.assign(st.docs.find(x=>x.id===id), o); }
      else st.docs.push({ id:uid('d'), ...o });
    });
    closeModal(); toast('Dokument gespeichert');
  },
  docdel: async e => { if(!confirm('Dokument entfernen?')) return;
    await mutate(st=>{ const i=st.docs.findIndex(x=>x.id===e.dataset.id); if(i>-1) st.docs.splice(i,1); }); closeModal(); },
  routine: e => openRoutine(e.dataset.id),
  rsh: e => { const s=e.dataset.v, a=window._R.shifts; const i=a.indexOf(s); i>-1?a.splice(i,1):a.push(s); e.setAttribute('aria-pressed', i<0); },
  rday: e => { const d=+e.dataset.v, a=window._R.days; const i=a.indexOf(d); i>-1?a.splice(i,1):a.push(d); e.setAttribute('aria-pressed', i<0); },
  rsave: async e => {
    const id=e.dataset.id;
    await mutate(st=>{ const r=st.routines.find(x=>x.id===id); if(!r) return;
      r.title=$('#rtitle').value.trim()||r.title; r.role=$('#rrole').value; r.prio=$('#rprio').value;
      r.offset=Math.max(0,parseInt($('#roff').value)||0);
      r.shifts=window._R.shifts.length?window._R.shifts:['F']; r.days=window._R.days.length?window._R.days:[1,2,3,4,5];
      st.genDays = st.genDays.filter(d=>d!==shiftDate());
      logEvent(st,'Routine geändert: '+r.title,'sys');
    });
    await ensureToday(); closeModal(); toast('Routine gespeichert');
  },
  rtoggle: async e => { await mutate(st=>{ const r=st.routines.find(x=>x.id===e.dataset.id); r.active=!r.active; logEvent(st,'Routine '+(r.active?'aktiviert':'deaktiviert')+': '+r.title,'sys'); }); closeModal(); },
  person: e => openPerson(e.dataset.id),
  personnew: () => openPerson(''),
  psave: async e => {
    const id=e.dataset.id, n=$('#pname').value.trim(); if(!n){ toast('Bitte Namen eingeben'); return; }
    const o = { name:n, role:$('#prole').value, title:$('#ptitle').value.trim(), area:$('#parea').value, shift:$('#pshift').value };
    await mutate(st=>{ if(id) Object.assign(st.people.find(x=>x.id===id), o); else st.people.push({id:uid('p'),...o}); });
    if(ME && ME.id===id) ME = personById(id);
    closeModal(); toast('Gespeichert');
  },
  pdel: async e => { if(!confirm('Person entfernen? Zugewiesene Aufgaben bleiben bestehen.')) return;
    await mutate(st=>{ const i=st.people.findIndex(x=>x.id===e.dataset.id); if(i>-1) st.people.splice(i,1); }); closeModal(); },
  csv: e => exportCsv(e.dataset.v),
  csvdl: e => {
    try{
      const blob = new Blob(['\ufeff'+$('#csvout').value], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = e.dataset.n;
      document.body.appendChild(a); a.click(); a.remove(); toast('Datei erzeugt');
    }catch(err){ toast('Download blockiert – Text bitte kopieren'); }
  },
  csvcopy: () => { const t=$('#csvout'); t.select(); try{ document.execCommand('copy'); toast('Kopiert'); }catch(e){ toast('Bitte manuell markieren und kopieren'); } },
  report: () => openReport(),
  print: () => window.print(),
  demo: () => { if(confirm('Beispieldaten der letzten 13 Tage erzeugen? Vorhandene Daten bleiben erhalten.')) makeDemo(); },
  reset: async () => { if(!confirm('Wirklich alle Aufgaben, Checklisten und Einstellungen zurücksetzen?')) return;
    S = seedState(); await sSet(KEY_STATE, JSON.stringify(S), true); VIEW='dash'; render(); toast('Zurückgesetzt'); }
};

document.addEventListener('click', ev => {
  const cl = ev.target.closest('[data-close]');
  if(cl){ closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const fn = ACT[el.dataset.act];
  if(fn){ ev.preventDefault(); fn(el); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.matches('[data-act=areafilter]')){ F.area = el.value; render(); }
  if(el.matches('[data-act=runarea]')){ RUN.area = el.value; }
  if(el.matches('[data-act=runshift]')){ RUN.shift = el.value; }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id==='docq'){ F.docQ = el.value; const p=el.selectionStart; render(); const n=$('#docq'); if(n){ n.focus(); n.setSelectionRange(p,p); } }
  if(el.matches('[data-act=cinote]')){ RUN.items[+el.dataset.i].note = el.value; }
});
$('#mechip').addEventListener('click', () => ACT.me());
$('#fab').addEventListener('click', () => openNewTask());
document.addEventListener('keydown', e => { if(e.key==='Escape' && MODAL) closeModal(); });

/* ---------- Start & Abgleich ---------- */
(async function init(){
  await loadState();
  const meId = await sGet(KEY_ME, false);
  if(meId) ME = personById(meId);
  LASTSYNC = Date.now();
  render();
  if(ME) await ensureToday();
  if(!HAS_STORE){
    const w = document.createElement('div');
    w.className='note'; w.style.cssText='padding:10px 14px;background:var(--warn-bg);color:var(--warn);text-align:center';
    w.textContent='Hinweis: Kein gemeinsamer Speicher verfügbar – Daten gelten nur für diese Sitzung.';
    document.querySelector('header').after(w);
  }
  setInterval(async () => {
    if(document.hidden || MODAL || SYNCING) return;
    SYNCING = true;
    try{
      const raw = await sGet(KEY_STATE, true);
      if(raw){
        const fresh = JSON.parse(raw);
        if(fresh.updated !== S.updated){ S = fresh; LASTSYNC = Date.now(); render(); }
        else { LASTSYNC = Date.now(); const l=$('#livet'); if(l) l.textContent = hhmm(LASTSYNC); }
      }
    }catch(e){}
    SYNCING = false;
  }, POLL_MS);
  setInterval(()=>{ if(ME && !MODAL) ensureToday(); }, 5*60*1000);
})();

</script>
